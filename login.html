<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Vania Anggraini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            background-color: var(--bg);
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .site-footer-login {
            position: absolute;
            bottom: 1.5rem;
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="auth-card">
            <h2>LOGIN ADMIN</h2>
            <p class="auth-subtitle">Sign in to manage portfolio projects</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <p id="loginError" class="form-message error"></p>

                <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
            </form>

            <a href="index.html" class="auth-back">&larr; Back to Portfolio</a>
        </div>
    </div>

    <footer class="site-footer-login">
        <p>&copy; 2026 MHD Ridwan Maulana. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
